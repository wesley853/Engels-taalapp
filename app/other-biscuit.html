<title>Other Biscuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app-schil. Desktop: vaste zijbalk + werkvlak. Telefoon: header + tabbalk onderin. Eén primaire actie per scherm. */
:root{
  --bg:#EEF2F3; --bg2:#E3EAEC; --surface:rgba(255,255,255,.78); --solid:#FFFFFF; --ink:#0F1E24; --muted:#5A6C72; --line:rgba(15,30,36,.10);
  --amber:#B8650F; --amber-soft:rgba(184,101,15,.12); --teal:#0F766E; --teal-soft:rgba(15,118,110,.12);
  --red:#B42318; --red-soft:rgba(180,35,24,.10); --green:#1F7A3A; --green-soft:rgba(31,122,58,.12);
  --glow1:rgba(15,118,110,.16); --glow2:rgba(184,101,15,.12); --shadow:0 1px 2px rgba(15,30,36,.06),0 8px 28px rgba(15,30,36,.07);
  --on-amber:#FFFFFF;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1518; --bg2:#0E1D21; --surface:rgba(22,38,43,.72); --solid:#13252A; --ink:#E7F0F1; --muted:#8FA4A9; --line:rgba(231,240,241,.09);
  --amber:#F2B66B; --amber-soft:rgba(242,182,107,.14); --teal:#6FD3C6; --teal-soft:rgba(111,211,198,.13);
  --red:#F19C8F; --red-soft:rgba(241,156,143,.12); --green:#8EDC9F; --green-soft:rgba(142,220,159,.12);
  --glow1:rgba(111,211,198,.13); --glow2:rgba(242,182,107,.10); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --on-amber:#1A1206; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1518; --bg2:#0E1D21; --surface:rgba(22,38,43,.72); --solid:#13252A; --ink:#E7F0F1; --muted:#8FA4A9; --line:rgba(231,240,241,.09);
  --amber:#F2B66B; --amber-soft:rgba(242,182,107,.14); --teal:#6FD3C6; --teal-soft:rgba(111,211,198,.13);
  --red:#F19C8F; --red-soft:rgba(241,156,143,.12); --green:#8EDC9F; --green-soft:rgba(142,220,159,.12);
  --glow1:rgba(111,211,198,.13); --glow2:rgba(242,182,107,.10); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --on-amber:#1A1206; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60vw 50vh at 85% -10%,var(--glow1),transparent 70%),radial-gradient(50vw 40vh at -10% 110%,var(--glow2),transparent 70%)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;line-height:1.05}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* ---- Schil ---- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--amber));color:var(--solid);flex:none}
.logo i svg{width:24px;height:24px}
.logo>span{display:flex;flex-direction:column;line-height:1.05}
.logo small{font:600 .7rem var(--f-body);letter-spacing:.02em;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;transition:background .2s,color .2s}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--teal-soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--teal)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.flame{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--amber-soft)}
.flame b{font:700 1.4rem var(--f-mono);color:var(--amber)}
main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:32px 64px}
.view{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view.enter{animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.mobile-top{display:none}
.tabbar{display:none}

/* ---- Bouwstenen ---- */
.glass{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack>.chip{align-self:flex-start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:12px;padding:12px 20px;cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--amber);color:var(--on-amber);box-shadow:0 6px 20px var(--amber-soft)}
.btn.primary:hover{box-shadow:0 8px 28px var(--glow2)}
.btn.teal{background:var(--teal);color:var(--solid)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.link{background:none;padding:6px 0;color:var(--teal)}
.btn.big{padding:16px 26px;font-size:1.05rem;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .78rem var(--f-mono);padding:4px 10px;border-radius:999px;background:var(--teal-soft);color:var(--ink);white-space:nowrap}
.chip svg{width:13px;height:13px;flex:none}
.chip.amber{background:var(--amber-soft)}
.chip.red{background:var(--red-soft)}
.chip.green{background:var(--green-soft)}
.chip.line{background:transparent;border:1px solid var(--line)}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
.brief{border-radius:12px;padding:14px 16px;background:var(--teal-soft)}
.notice{font-size:.92rem;padding:12px 14px;border-radius:12px;background:var(--amber-soft)}
.err{font-size:.92rem;padding:12px 14px;border-radius:12px;background:var(--red-soft)}
details summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:.92rem}

/* ---- Vandaag ---- */
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow2),transparent 70%);pointer-events:none}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font:700 2rem var(--f-mono);display:block;line-height:1}
.plan{display:flex;gap:8px;flex-wrap:wrap}
.plan span{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.plan span i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{padding:18px}
.kpi b{display:block;font:700 1.7rem var(--f-mono);margin-top:4px}
.weekdots{display:flex;gap:8px}
.weekdots div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.weekdots span{width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;background:var(--line);display:grid;place-items:center}
.weekdots span.on{background:linear-gradient(135deg,var(--teal),var(--amber))}
.weekdots span.today{outline:2px solid var(--teal);outline-offset:2px}
.weekdots span svg{width:16px;height:16px;color:var(--solid)}
.suggest{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ---- Opdrachtkaarten ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.tcard{text-align:left;cursor:pointer;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.tcard:hover{transform:translateY(-3px);border-color:var(--teal)}
.tcard .dur{display:flex;align-items:baseline;gap:4px}
.tcard .dur b{font:700 2.1rem var(--f-mono);line-height:1;color:var(--amber)}
.tcard p{color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---- Sessie / focus ---- */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stepper div{display:flex;flex-direction:column;gap:8px;font-size:.85rem;font-weight:600;color:var(--muted)}
.stepper i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.stepper i>u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .5s}
.stepper .done i>u{width:100%}
.stepper .cur{color:var(--ink)}
.stepper .cur i>u{width:50%}
.flash{perspective:1200px}
.flash .inner{position:relative;min-height:240px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:28px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.flash .back{transform:rotateY(180deg)}
.flash .q{font-family:var(--f-display);font-size:clamp(1.4rem,3vw,1.9rem);font-weight:600;line-height:1.2}
.flash .a{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,1.7rem);font-weight:600;color:var(--teal)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;transition:transform .15s,border-color .2s}
.grade button:hover{transform:translateY(-2px);border-color:var(--teal)}
.grade button small{font:500 .74rem var(--f-mono);color:var(--muted)}
.grade button.sug{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fb{display:flex;flex-direction:column;gap:10px}
.fbp{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px;border-radius:12px;background:var(--solid);border:1px solid var(--line)}
.fbp .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 .85rem var(--f-mono);background:var(--amber-soft);color:var(--amber)}
.fbp .wrong{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
.fbp .right{color:var(--green);font-weight:700}
.version{border-left:3px solid var(--teal);padding:4px 0 4px 16px;white-space:pre-wrap}
.home-head{display:flex;justify-content:space-between;align-items:center;gap:16px}
.ring.sm{width:112px;height:112px}.ring.sm .lbl b{font-size:1.55rem}
.sessions{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.session-card{padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-height:230px}
.session-card::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--glow1),transparent 70%);pointer-events:none}
.session-card.dagelijks::after{background:radial-gradient(circle,var(--glow2),transparent 70%)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.94rem}
.plan-list li{display:flex;gap:9px;align-items:center}
.plan-list li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.session-card.dagelijks .plan-list li::before{background:var(--amber)}
.word-en{font-family:var(--f-display);font-size:clamp(2.1rem,5vw,2.9rem);font-weight:800;color:var(--teal);line-height:1.05;letter-spacing:-.02em}
.word-nl{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.testword{font-family:var(--f-display);font-size:clamp(2.4rem,7vw,3.4rem);font-weight:800;text-align:center;padding:36px 10px;letter-spacing:-.02em}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.reading{font-size:1.08rem;line-height:1.75;max-width:68ch}
.reading p+p{margin-top:12px}
.reading mark.gl{background:var(--amber-soft);color:inherit;border-radius:4px;padding:0 3px;cursor:pointer;border-bottom:2px dotted var(--amber)}
.reading mark.gl.sel{background:var(--amber);color:var(--on-amber)}
.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.gl-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--solid);cursor:pointer}
.gl-item input{margin-top:4px;accent-color:var(--teal)}
.bandchart{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;height:140px;align-items:end}
.bandchart div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font:500 .72rem var(--f-mono);color:var(--muted)}
.bandchart i{width:100%;max-width:40px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--teal),var(--teal-soft));transition:height .8s}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);animation:in .3s ease}
.resume-bar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--amber)}
.verdict{font-size:.92rem;padding:8px 12px;border-radius:10px;background:var(--line);align-self:flex-start}
.verdict.green{background:var(--green-soft)}.verdict.amber{background:var(--amber-soft)}.verdict.red{background:var(--red-soft)}
.good{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--green-soft)}
.good svg{width:20px;height:20px;flex:none;color:var(--green);margin-top:2px}
.celebrate{text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.celebrate .badge{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--amber));color:var(--solid);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.celebrate .badge svg{width:42px;height:42px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;top:50%;left:50%;animation:spark 1.1s ease-out forwards;opacity:0}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(260deg)}}

/* ---- Actieve opdracht ---- */
.task-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.clock{position:relative;width:120px;height:120px}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:8}
.clock .track{stroke:var(--line)}
.clock .fill{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.clock.over .fill{stroke:var(--amber)}
.clock .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.clock .lbl b{font:700 1.35rem var(--f-mono)}
.clock .lbl span{font-size:.75rem;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li button{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--solid);cursor:pointer}
.steps li button .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.steps li button .box svg{width:14px;height:14px;opacity:0}
.steps li.done button{opacity:.6}
.steps li.done .box{background:var(--teal);border-color:var(--teal);color:var(--solid)}
.steps li.done .box svg{opacity:1}
.steps li.done .txt{text-decoration:line-through}
.chat{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding:4px}
.msg{padding:11px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.msg:last-child{animation:in .3s ease}
.msg.ai{background:var(--solid);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--teal);color:var(--solid);align-self:flex-end;border-bottom-right-radius:4px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.loading-dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---- Kaarten & voortgang ---- */
table{border-collapse:collapse;width:100%;font-size:.93rem}
td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.del{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.del:hover{background:var(--red-soft);color:var(--red)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:160px;align-items:end}
.bars div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font:500 .75rem var(--f-mono);color:var(--muted)}
.bars i{width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--teal),var(--teal-soft));min-height:3px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bars .goal{color:var(--ink)}
.hbar{display:grid;grid-template-columns:150px 1fr 34px;gap:12px;align-items:center;font-size:.93rem}
.hbar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:5px;background:var(--amber)}

/* ---- Telefoon ---- */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}

/* ================= FSRS-5 ================= */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5,FACTOR=19/81,DAY=864e5;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retr=(t,S)=>Math.pow(1+FACTOR*t/S,DECAY);
const d0=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
function nextState(c,g,now){
  if(!c.s) return {s:W[g-1],d:d0(g)};
  const t=Math.max(0,(now-c.last)/DAY),R=retr(t,c.s);
  let d=c.d+(-W[6]*(g-3))*(10-c.d)/9; d=clamp(W[7]*d0(4)+(1-W[7])*d,1,10);
  const s=g===1?Math.min(c.s,W[11]*Math.pow(c.d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp(W[14]*(1-R)))
    :c.s*(Math.exp(W[8])*(11-c.d)*Math.pow(c.s,-W[9])*(Math.exp(W[10]*(1-R))-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1);
  return {s,d};
}
const intervalDays=(c,g,now)=>g===1?0:Math.max(1,Math.round(nextState(c,g,now).s));
function review(c,g,now){const st=nextState(c,g,now),days=intervalDays(c,g,now);
  return {...c,s:st.s,d:st.d,last:now,due:g===1?now+10*60e3:now+days*DAY,reps:(c.reps||0)+1,lapses:(c.lapses||0)+(g===1?1:0)};}
const fmtInt=d=>d===0?"10 min":d===1?"1 dag":d<30?d+" dagen":d<365?Math.round(d/30)+" mnd":(d/365).toFixed(1)+" jr";

/* ================= Opslag ================= */
let db=null,uid=null,sample=null,storeMode="lokaal",storeMsg="";
const state={cards:{},profile:{days:{},mistakes:{},done:{},dailyIdx:0,lastDaily:"",sessions:{}}};
const dkey=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const today=()=>dkey();
function starterDeck(){const now=Date.now(),o={};STARTER_CARDS.forEach(([nl,en,ex],i)=>o["s"+i]={nl,en,ex,src:"start",due:now-(STARTER_CARDS.length-i)*1000,created:now});return o;}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const wq={deck:Promise.resolve(),profile:Promise.resolve(),resume:Promise.resolve()},wt={},lastSaved={};
let bootDone=false;
function bodyFor(which){return which==="deck"?{cards:state.cards}:which==="profile"?state.profile:resumeBody();}
function save(which,now){
  if(which==="resume"&&!bootDone)return;
  clearTimeout(wt[which]);
  const run=()=>{
    const body=JSON.parse(JSON.stringify(bodyFor(which))),str=JSON.stringify(body);
    if(lastSaved[which]===str)return;lastSaved[which]=str;
    lsSet("we_"+which,body);
    if(db&&uid) wq[which]=wq[which].then(()=>db.doc("data/users/"+uid+"/"+which).set(body)).catch(e=>{storeMsg="Opslaan in je account lukte niet ("+(e&&e.code||"fout")+"). Je voortgang staat wel in deze browser.";render();});
  };
  if(now)run();else wt[which]=setTimeout(run,400);
}
/* Waar je gebleven was: sessie en opdracht worden na elke stap bewaard */
function resumeBody(){
  const ser=s=>s.active?{track:s.track,date:s.date,phase:s.phase,queue:s.queue,idx:s.idx,flipped:s.flipped,input:s.input,text:s.text,fb:s.fb,reviewed:s.reviewed,added:s.added,newWords:s.newWords,newIdx:s.newIdx,learned:s.learned,elapsed:Math.round((Date.now()-s.start)/1000)}:null;
  return {date:today(),view,cur:S.track,SS:{werk:ser(SESS.werk),dagelijks:ser(SESS.dagelijks)},
    T:T.active?{t:T.t,elapsed:taskElapsed(),text:T.text,fb:T.fb,chat:T.chat,checked:T.checked}:null};
}
function applyResume(r){
  if(!r)return false;
  let restored=false;
  const restoreS=(tr,o)=>{if(!o||o.date!==today())return;const s=SESS[tr];Object.assign(s,newS(tr),o,{track:tr,active:true,loading:false,err:""});s.start=Date.now()-(o.elapsed||0)*1000;};
  if(r.SS){restoreS("werk",r.SS.werk);restoreS("dagelijks",r.SS.dagelijks);}
  else if(r.S){restoreS("werk",{...r.S,phase:["review","task","fb","done"][r.S.step]||"review"});}
  if(r.cur&&SESS[r.cur])S=SESS[r.cur];
  if(r.T&&r.T.t){Object.assign(T,r.T,{active:true,loading:false,err:"",summary:null,paused:true});}
  if(r.view==="sessie"&&S.active){view="sessie";restored=true;}
  else if(r.view==="taak"&&T.active){resumeTask(true);restored=true;}
  return restored;
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3600);}
addEventListener("pagehide",()=>save("resume",true));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save("resume",true);});
async function boot(){
  const lc=lsGet("we_deck"),lp=lsGet("we_profile");let resume=lsGet("we_resume");
  state.cards=(lc&&lc.cards)||starterDeck();
  if(lp) Object.assign(state.profile,lp);
  render();
  if(!window.claude||!window.claude.use){storeMsg="Je gebruikt een losse kopie. Open Other Biscuit via claude.ai voor feedback van Claude en om je voortgang op te slaan.";finishBoot(resume);return;}
  claude.use("sample").then(s=>{sample=s;render();});
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(d&&u){const id=await u.id();if(id){db=d;uid=id;storeMode="account";
    try{const [dk,pf,rs]=await Promise.all([db.doc("data/users/"+uid+"/deck").get(),db.doc("data/users/"+uid+"/profile").get(),db.doc("data/users/"+uid+"/resume").get()]);
      if(rs.exists) resume=rs.data();
      if(dk.exists) state.cards=dk.data().cards||{}; else save("deck");
      if(pf.exists) state.profile=Object.assign({days:{},mistakes:{},done:{},dailyIdx:0,lastDaily:"",sessions:{}},pf.data()); else save("profile");
    }catch(e){storeMsg="Je opgeslagen voortgang kon niet worden geladen. Je werkt nu met de versie in deze browser.";}}}
  if(storeMode==="lokaal"&&!storeMsg) storeMsg="Je voortgang wordt alleen in deze browser bewaard.";
  finishBoot(resume);
}
function finishBoot(resume){
  const restored=applyResume(resume);
  bootDone=true;render();
  if(restored)toast("Je gaat verder waar je was gebleven.");
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=(n,cls)=>`<svg class="${cls||""}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const due=tr=>Object.entries(state.cards).filter(([,c])=>c.due<=Date.now()&&(!tr||trackOf(c)===tr)).sort((a,b)=>a[1].due-b[1].due);
const minsToday=()=>state.profile.days[today()]||0;
const sessionDone=tr=>{const p=state.profile;if(tr==="werk"&&(p.sessions||{})[today()])return true;return !!((p.sess||{})[tr]||{})[today()];};
function markSessionDone(tr){const p=state.profile;p.sess=p.sess||{};p.sess[tr]=p.sess[tr]||{};p.sess[tr][today()]=true;}
function addMinutes(m){const t=today();state.profile.days[t]=(state.profile.days[t]||0)+m;save("profile");}
function streak(){let n=0;const d=new Date();if(!(state.profile.days[dkey(d)]>0))d.setDate(d.getDate()-1);while(state.profile.days[dkey(d)]>0){n++;d.setDate(d.getDate()-1);}return n;}
const fmtClock=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

const MINOR=new Set(["a","an","the","to","some","my","our","your","this","that"]);
function toWords(str){
  return String(str).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean)
    .flatMap(w=>(CONTR[w]||w.replace(/'s$/,"")).split(" "))
    .map(w=>w.replace(/'/g,"").replace(/is(e|ed|es|ing|ation|ations)$/,"iz$1").replace(/yse$/,"yze").replace(/our$/,"or").replace(/tre$/,"ter"))
    .filter(w=>w&&w!=="something"&&w!=="someone");
}
function lev(a,b){const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
const typoOK=(a,b)=>{const L=Math.max(a.length,b.length);return lev(a,b)<=(L>=8?2:L>=4?1:0);};
function answerVariants(en){
  const out=[];
  String(en).split("/").forEach(alt=>{
    const plain=alt.replace(/\(.*?\)/g," ");
    out.push(plain);
    const inner=[...alt.matchAll(/\(([^)]*)\)/g)].map(m=>m[1]).filter(x=>/^[a-z ]+$/i.test(x.trim()));
    if(inner.length){out.push(alt.replace(/[()]/g," "));inner.forEach(x=>out.push(x));}
  });
  return out.map(toWords).filter(w=>w.length);
}
/* Woord-voor-woord uitlijnen. Spelfout = 0, ontbrekend lidwoord = klein, ontbrekend kernwoord = 1, extra woord = bijna gratis. */
function alignWords(A,T){
  const m=A.length,n=T.length,INF=1e9;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(INF)),bt=Array.from({length:m+1},()=>Array(n+1).fill(null));
  dp[0][0]=0;
  for(let i=0;i<=m;i++)for(let j=0;j<=n;j++){const c=dp[i][j];if(c===INF)continue;
    if(i<m&&j<n){const a=A[i],t=T[j];
      if(a===t){if(c<dp[i+1][j+1]){dp[i+1][j+1]=c;bt[i+1][j+1]=["ok",a,t];}}
      else if(typoOK(a,t)){if(c+0.01<dp[i+1][j+1]){dp[i+1][j+1]=c+0.01;bt[i+1][j+1]=["typo",a,t];}}
      else{const k=MINOR.has(t)?0.4:1;if(c+k<dp[i+1][j+1]){dp[i+1][j+1]=c+k;bt[i+1][j+1]=["sub",a,t];}}}
    if(j<n){const k=MINOR.has(T[j])?0.3:1;if(c+k<dp[i][j+1]){dp[i][j+1]=c+k;bt[i][j+1]=["miss",null,T[j]];}}
    if(i<m){if(c+0.05<dp[i+1][j]){dp[i+1][j]=c+0.05;bt[i+1][j]=["extra",A[i],null];}}
  }
  const ops=[];let i=m,j=n;while(i||j){const o=bt[i][j];ops.unshift(o);if(o[0]!=="miss")i--;if(o[0]!=="extra")j--;}
  return ops;
}
function checkAnswer(input,en){
  const A=toWords(input);
  if(!A.length)return {level:"empty"};
  let best=null;
  for(const T of answerVariants(en)){
    const ja=A.join(""),jt=T.join("");
    if(ja===jt)return {level:"exact"};
    if(A.length!==T.length&&lev(ja,jt)<=1)return {level:"typo",typos:[[null,A.join(" "),T.join(" ")]]};
    const ops=alignWords(A,T);
    const core=T.filter(w=>!MINOR.has(w)).length||T.length;
    const coreHit=ops.filter(o=>(o[0]==="ok"||o[0]==="typo")&&!MINOR.has(o[2])).length;
    const bad=ops.filter(o=>(o[0]==="miss"||o[0]==="sub")&&!MINOR.has(o[2])).length;
    const r={ops,score:coreHit/core,bad,typos:ops.filter(o=>o[0]==="typo"),minor:ops.filter(o=>(o[0]==="miss"||o[0]==="sub")&&MINOR.has(o[2]))};
    if(!best||r.bad<best.bad||(r.bad===best.bad&&r.score>best.score))best=r;
  }
  if(best.bad===0) best.level=best.typos.length?"typo":best.minor.length?"minor":"exact";
  else best.level=best.score>=.5?"close":"wrong";
  return best;
}
function verdictHTML(res){
  const q=w=>`<b>${esc(w)}</b>`;
  if(res.level==="empty")return {chip:"line",text:"Bekijk het antwoord en kies hoe goed je het wist.",grade:1};
  if(res.level==="exact")return {chip:"green",text:"Klopt!",grade:3};
  if(res.level==="typo")return {chip:"green",text:"Goed! Alleen de spelling: "+res.typos.map(o=>`${esc(o[1])} → ${q(o[2])}`).join(", "),grade:3};
  if(res.level==="minor")return {chip:"green",text:"Goed! Klein verschil: "+res.minor.map(o=>o[0]==="miss"?`${q(o[2])} ontbrak`:`${esc(o[1])} → ${q(o[2])}`).join(", "),grade:3};
  const miss=res.ops.filter(o=>o[0]==="miss"&&!MINOR.has(o[2])).map(o=>q(o[2]));
  const sub=res.ops.filter(o=>o[0]==="sub"&&!MINOR.has(o[2])).map(o=>`${esc(o[1])} → ${q(o[2])}`);
  const det=[miss.length?"je mist "+miss.join(", "):"",sub.length?sub.join(", "):""].filter(Boolean).join("; ");
  if(res.level==="close")return {chip:"amber",text:"Bijna: "+det,grade:2};
  return {chip:"red",text:"Nog niet"+(det?": "+det:"")+". Deze komt snel terug.",grade:1};
}

async function fetchWords(n){

  const pick=[];let i=v.next;
  while(pick.length<n+3&&i<WORDS.length){const w=WORDS[i++];if(!v.known[w]&&!have.has(w))pick.push(w);}
  if(!pick.length)return [];
  const r=await sample.json(`You help a Dutch adult (level B1-B2) learn everyday English words. For each word below give:

  const byEn={};(r.words||[]).forEach(x=>{if(x&&x.en)byEn[String(x.en).toLowerCase()]=x;});
  const out=[];let last=null;
  for(const w of pick){
    if(out.length>=n)break;

    out.push({en:w,nl:String(x.nl),ex:String(x.ex||"")});

        <input type="text" id="revIn" placeholder="Typ je antwoord en druk op Enter (spelling hoeft niet perfect)" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.input)}" ${S.flipped?"tabindex=-1":""}>
      </div>
      <div class="glass face back"><div class="spread"><span class="eyebrow">${esc(c.nl)}</span><button class="btn link" id="sayCard" style="padding:0">${icon("sound")} Luister</button></div><div class="a">${esc(c.en)}</div><p class="muted">${esc(c.ex)}</p>
        ${S.input?`<p class="small">Jij schreef: <b>${esc(S.input)}</b></p>`:""}${vd?`<p class="verdict ${vd.chip}">${vd.text}</p>`:""}</div>
    </div></div>
    ${S.flipped?`<div class="stack" style="gap:8px"><span class="small muted">Jij beslist. De gemarkeerde knop is een voorstel. Onder elke knop staat wanneer de kaart terugkomt.</span>
      <div class="grade">${[["Opnieuw",1],["Moeilijk",2],["Goed",3],["Makkelijk",4]].map(([l,g])=>`<button data-g="${g}" class="${g===sug?"sug":""}">${l}<small>${fmtInt(intervalDays(c,g,Date.now()))}</small></button>`).join("")}</div></div>`
    :`<div class="row"><button class="btn teal" id="flip">Toon antwoord</button><span class="small muted">Of druk op Enter</span></div>`}`;
  }else if(S.phase==="new"){
    if(!S.newWords){
      body=`<div class="glass pad stack" style="align-items:flex-start">${S.newErr?errHTML(S.newErr)+`<div class="row"><button class="btn teal" id="retryNew">Opnieuw proberen</button><button class="btn link" id="skipNew">Sla nieuwe woorden over →</button></div>`
        :`<p class="loading-dots">Claude zoekt je nieuwe woorden</p><button class="btn link" id="skipNew">Sla nieuwe woorden over →</button>`}</div>`;
    }else if(S.newIdx>=S.newWords.length){
      if(S.learned.length){S.phase="recall";S.queue=S.learned.slice();S.idx=0;S.flipped=false;S.input="";}else nextPhase();
      return renderSession(m);
    }else{
      const w=S.newWords[S.newIdx];
      body=`<div class="spread"><span class="eyebrow">Nieuw woord ${S.newIdx+1} van ${S.newWords.length}</span><button class="btn link" id="skipNew">Sla nieuwe woorden over →</button></div>
      <section class="glass pad stack newword">
        <div class="spread"><span class="word-en">${esc(w.en)}</span><button class="btn ghost" id="sayNew">${icon("sound")} Luister</button></div>
        <div class="word-nl">${esc(w.nl)}</div>
        <p class="muted" style="font-size:1.05rem">${esc(w.ex)}</p>
      </section>
      <div class="row"><button class="btn ghost big" id="knowIt">Ken ik al</button><button class="btn primary big" id="learnIt">Leer dit woord</button></div>
      <p class="small muted">Woorden die je kiest om te leren, oefen je meteen daarna door ze zelf te typen. "Ken ik al" slaat het woord voortaan over.</p>`;
    }
  }else if(S.phase==="task"){
    body=`<div class="glass pad stack">
      <div class="spread"><span class="chip ${t.type==="spreken"?"amber":""}">${TYPE_LABEL[t.type]} · ${esc(t.len)}</span></div>
      <h2>${esc(t.title)}</h2>
      <div class="brief">${esc(t.brief)}</div>
      ${t.type==="spreken"?DICTATE:""}
      <textarea id="dText" placeholder="${t.type==="spreken"?"Spreek in met dicteren, of typ wat je zou zeggen…":"Schrijf in het Engels…"}">${esc(S.text)}</textarea>
      ${errHTML(S.err)}
      <div class="spread"><span class="small muted mono" id="wc">${wc(S.text)} woorden</span>
      <button class="btn primary" id="dSend" ${!sample||S.loading?"disabled":""}>${S.loading?'<span class="loading-dots">Claude leest mee</span>':icon("spark")+" Vraag feedback"}</button></div>
      ${needClaude()}
    </div>`;
  }else if(S.phase==="fb"){
    body=`<div class="glass pad stack"><h2>Feedback op "${esc(t.title)}"</h2>${feedbackHTML(S.fb)}
      <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost" id="again">Nog een poging</button><button class="btn primary" id="finish">Sessie afronden</button></div></div>`;
  }else{
    body=`<div class="glass celebrate" id="cele"><div class="badge">${icon("check")}</div><h1>Sessie voltooid</h1>
      <p class="muted">${S.doneMins||1} min geoefend · ${S.reviewed} kaarten herhaald · ${S.added} nieuwe kaarten</p>
      <p><span class="chip amber">${streak()} ${streak()===1?"dag":"dagen"} op rij</span></p>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" data-go="opdrachten">Langere opdracht doen</button><button class="btn primary" data-go="vandaag">Terug naar vandaag</button></div></div>`;
  }
  m.innerHTML=`<div class="view">
    ${S.phase!=="done"?`<div class="spread"><button class="btn link" id="exit">${icon("back")} Later verder</button><span class="chip ${tr==="werk"?"":"amber"}">${TRACK_LABEL[tr]}</span></div>${stepperHTML()}`:""}
    ${body}</div>`;
  const ex=$("#exit");if(ex)ex.onclick=()=>{view=null;render();};
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(S.phase==="review"||S.phase==="recall"){
    const inp=$("#revIn");
    const flip=()=>{S.input=inp.value.trim();S.flipped=true;renderSession(m);save("resume");};
    if(inp&&!S.flipped){inp.focus({preventScroll:true});inp.onkeydown=e=>{if(e.key==="Enter")flip();};}
    const f=$("#flip");if(f)f.onclick=flip;
    const sc=$("#sayCard");if(sc)sc.onclick=()=>say(state.cards[S.queue[S.idx]].en);
    const sk=$("#skipRev");if(sk)sk.onclick=()=>{nextPhase();render();};
    m.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const id=S.queue[S.idx];state.cards[id]=review(state.cards[id],+b.dataset.g,Date.now());save("deck");
      S.reviewed++;S.idx++;S.flipped=false;S.input="";if(S.idx>=S.queue.length)nextPhase();render();});
  }
  if(S.phase==="new"){
    const sk=$("#skipNew");if(sk)sk.onclick=()=>{S.newWords=S.newWords||[];S.newIdx=S.newWords.length;render();};
    const rt=$("#retryNew");if(rt)rt.onclick=()=>loadNewWords();
    const w=S.newWords&&S.newWords[S.newIdx];
    if(w){
      $("#sayNew").onclick=()=>say(w.en);
      $("#knowIt").onclick=()=>{vocab().known[w.en]=1;save("profile");S.newIdx++;render();};
      $("#learnIt").onclick=()=>{const n=Date.now(),id="w"+n+"_"+S.newIdx;
        state.cards[id]={nl:w.nl,en:w.en,ex:w.ex,src:"woord",track:"dagelijks",due:n,created:n};save("deck");
        S.learned.push(id);S.added++;S.newIdx++;render();};
    }
  }
  if(S.phase==="task"){
    const ta=$("#dText");ta.oninput=()=>{S.text=ta.value;$("#wc").textContent=wc(ta.value)+" woorden";save("resume");};
    $("#dSend").onclick=async()=>{
      if(S.text.trim().length<15){S.err="Schrijf of spreek eerst wat meer in.";return renderSession(m);}
      S.loading=true;S.err="";renderSession(m);
      try{S.fb=await getFeedback(t.brief+" ("+t.len+")",S.text,"",tr);S.added+=applyFeedback(S.fb,tr);S.phase="fb";}catch(e){S.err=sampleError(e);}
      S.loading=false;render();
    };
  }
  if(S.phase==="fb"){
    $("#again").onclick=()=>{S.phase="task";S.fb=null;renderSession(m);};
    $("#finish").onclick=()=>{
      S.doneMins=Math.max(1,Math.round((Date.now()-S.start)/60000));addMinutes(S.doneMins);
      markSessionDone(tr);save("profile");
      S.phase="done";S.active=false;render();confetti();
    };
  }
}
document.addEventListener("keydown",e=>{
  if(view!=="sessie"||!(S.phase==="review"||S.phase==="recall")||!S.flipped||!["1","2","3","4"].includes(e.key))return;
  const b=document.querySelector(`[data-g="${e.key}"]`);b&&b.click();
});

const wc=s=>String(s||"").trim().split(/\s+/).filter(Boolean).length;
function confetti(){
  const el=$("#cele");if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["var(--teal)","var(--amber)","var(--green)"];
  for(let i=0;i<36;i++){const s=document.createElement("i");s.className="spark";const a=Math.random()*Math.PI*2,r=120+Math.random()*160;
    s.style.cssText=`--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-40}px;background:${cols[i%3]};animation-delay:${Math.random()*.15}s`;el.appendChild(s);}
}

/* ================= Opdrachten ================= */
const TF={dur:"alle",type:"alle",track:"alle"};
function taskCard(t){
  const d=state.profile.done[t.id];
  return `<button class="glass tcard" data-task="${t.id}">
    <div class="spread"><span class="dur"><b>${t.mins}</b><span class="muted small">min</span></span><span class="chip ${t.mode==="rollenspel"?"amber":""}">${t.mode==="rollenspel"?"Rollenspel":TYPE_LABEL[t.type]}</span></div>
    <h3>${esc(t.title)}</h3><p>${esc(t.brief)}</p>
    <div class="foot"><span class="chip line">${trackOfTask(t)==="werk"?"Werk":"Dagelijks"}</span>${d?`<span class="chip green">${icon("check")} ${d.count}× · gem. ${Math.round(d.totalMins/d.count)} min</span>`:`<span class="chip line">Nog niet gedaan</span>`}</div>
  </button>`;
}
function bindTaskCards(m){m.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>startTask(LONG_TASKS.find(t=>t.id===b.dataset.task)));}
const CUSTOM={desc:"",mins:20,type:"schrijven",track:"werk"};
function renderTasks(m){
  const fd=t=>TF.dur==="alle"||(TF.dur==="kort"&&t.mins<=15)||(TF.dur==="middel"&&t.mins>15&&t.mins<=30)||(TF.dur==="lang"&&t.mins>30);
  const ft=t=>(TF.type==="alle"||(TF.type==="rollenspel"?t.mode==="rollenspel":t.type===TF.type&&t.mode!=="rollenspel"))&&(TF.track==="alle"||trackOfTask(t)===TF.track);
  const list=LONG_TASKS.filter(t=>fd(t)&&ft(t));
  const fbtn=(k,v,l)=>`<button data-f="${k}:${v}" aria-pressed="${TF[k]===v}">${l}</button>`;
  m.innerHTML=`<div class="view">
    ${noticeHTML()}
    ${pausedTaskHTML()}
    <div><p class="eyebrow">Voor als je meer tijd hebt</p><h1>Opdrachten</h1><p class="muted" style="margin-top:8px;max-width:60ch">Elke opdracht heeft een geschatte duur en een stappenplan. Een timer houdt bij hoe lang je er echt over doet, zodat je ziet of je sneller wordt.</p></div>
    <div class="stack" style="gap:10px">
      <div class="filters" role="group" aria-label="Tijd">${fbtn("dur","alle","Alle tijden")}${fbtn("dur","kort","10 tot 15 min")}${fbtn("dur","middel","20 tot 30 min")}${fbtn("dur","lang","45 min")}</div>
      <div class="filters" role="group" aria-label="Spoor">${fbtn("track","alle","Werk en dagelijks")}${fbtn("track","werk","Werk")}${fbtn("track","dagelijks","Dagelijks Engels")}</div>
      <div class="filters" role="group" aria-label="Soort">${fbtn("type","alle","Alle soorten")}${fbtn("type","schrijven","Schrijven")}${fbtn("type","rollenspel","Rollenspel")}${fbtn("type","luisteren","Luisteren")}</div>
    </div>
    <div class="grid">${list.map(taskCard).join("")||'<p class="muted">Geen opdrachten met deze filters.</p>'}</div>
    <section class="glass pad stack">
      <div><h3>Eigen opdracht</h3><p class="small muted">Plak een echte mail of beschrijf een situatie uit je werk. Kies de soort en hoeveel tijd je hebt.</p></div>
      <textarea id="cDesc" style="min-height:100px" placeholder="Bijv.: ik moet morgen een klant uitleggen waarom we overstappen naar Performance Max.">${esc(CUSTOM.desc)}</textarea>
      <div class="row">
        <select id="cTrack" style="width:auto"><option value="werk">Werk</option><option value="dagelijks">Dagelijks Engels</option></select>
        <select id="cType" style="width:auto"><option value="schrijven">Schrijven</option><option value="spreken">Spreken</option><option value="rollenspel">Rollenspel</option></select>
        <select id="cMins" style="width:auto"><option value="10">10 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min</option></select>
        <button class="btn primary" id="cStart">${icon("play")} Start</button>
      </div>
    </section>
  </div>`;
  $("#cType").value=CUSTOM.type;$("#cTrack").value=CUSTOM.track;$("#cTrack").onchange=e=>CUSTOM.track=e.target.value;$("#cMins").value=String(CUSTOM.mins);
  m.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.f.split(":");TF[k]=v;renderTasks(m);});
  bindTaskCards(m);
  $("#cDesc").oninput=e=>CUSTOM.desc=e.target.value;
  $("#cType").onchange=e=>CUSTOM.type=e.target.value;
  $("#cMins").onchange=e=>CUSTOM.mins=+e.target.value;
  $("#cStart").onclick=()=>{const d=CUSTOM.desc.trim();if(d.length<10){$("#cDesc").focus();return;}
    const rp=CUSTOM.type==="rollenspel",n=CUSTOM.mins;
    startTask({id:"eigen",track:CUSTOM.track,mins:n,type:rp?"spreken":CUSTOM.type,mode:rp?"rollenspel":"feedback",title:"Eigen opdracht",brief:d,
      role:rp?`Play the other person in this workplace situation described by the learner (in Dutch): "${d}". Stay in character, be realistic, ask follow-up questions.`:"",
      steps:[["Bedenk wat je wilt bereiken",Math.round(n*.2)],["Voer de opdracht uit",Math.round(n*.65)],["Neem de feedback door",n-Math.round(n*.2)-Math.round(n*.65)]]});};
}

/* ================= Actieve opdracht ================= */
const T={t:null,active:false,paused:false,start:0,elapsed:0,timer:null,text:"",fb:null,loading:false,err:"",chat:[],checked:[],summary:null};
const taskElapsed=()=>T.paused?T.elapsed:Math.floor((Date.now()-T.start)/1000);
function startTask(t){
  Object.assign(T,{t,active:true,paused:false,start:Date.now(),elapsed:0,text:"",fb:null,loading:false,err:"",chat:[],checked:[],summary:null});
  clearInterval(T.timer);T.timer=setInterval(tick,1000);
  view="taak";render();window.scrollTo({top:0});
  if(t.mode==="rollenspel")aiTurn();
}
function pauseTask(){T.elapsed=taskElapsed();T.paused=true;clearInterval(T.timer);}
function resumeTask(silent){
  T.start=Date.now()-T.elapsed*1000;T.paused=false;clearInterval(T.timer);T.timer=setInterval(tick,1000);view="taak";
  if(!silent){render();window.scrollTo({top:0});}
  if(T.t.mode==="rollenspel"&&!T.chat.length&&!T.fb)setTimeout(aiTurn,0);
}
function pausedTaskHTML(){
  if(!T.active||view==="taak")return "";
  return `<section class="glass pad resume-bar"><div class="stack" style="gap:2px"><span class="eyebrow">Je was hiermee bezig</span><h3>${esc(T.t.title)}</h3><span class="small muted mono">${fmtClock(T.elapsed)} van ${T.t.mins} min · alles is bewaard</span></div>
    <div class="row"><button class="btn link" id="dropTask">Stoppen</button><button class="btn primary" id="resumeTask">${icon("play")} Ga verder</button></div></section>`;
}
function tick(){
  if(view!=="taak"||!T.t||T.summary)return;
  T.elapsed=Math.floor((Date.now()-T.start)/1000);
  const c=$(".clock");if(!c)return;
  const p=T.elapsed/(T.t.mins*60),C=2*Math.PI*52;
  c.querySelector(".fill").style.strokeDashoffset=C*(1-Math.min(1,p));c.classList.toggle("over",p>1);
  c.querySelector("b").textContent=fmtClock(T.elapsed);
  c.querySelector(".lbl span").textContent=p>1?"over de tijd":"van "+T.t.mins+" min";
}
async function aiTurn(){
  if(!sample){T.err="Rollenspel werkt als je Other Biscuit via claude.ai opent.";return render();}
  T.loading=true;render();
  const sys=`${T.t.role}\nThis is a speaking practice role-play with a Dutch learner (B1-B2) of business English. Use natural, professional business English. Keep each reply to 1-3 sentences and end with something the learner can respond to. Do not correct the learner. Never break character.`;
  const turns=[{role:"user",content:sys+"\n\nStart the conversation now with your first line."}];
  T.chat.forEach(x=>turns.push({role:x.who==="ai"?"assistant":"user",content:x.text}));
  try{const r=await sample(turns,{modelTier:"quick",cache:false});T.chat.push({who:"ai",text:r.text.trim()});}catch(e){T.err=sampleError(e);}
  T.loading=false;render();
}
async function sendTask(text,extra){
  T.loading=true;T.err="";render();
  try{const tr=trackOfTask(T.t);T.fb=await getFeedback(T.t.brief,text,extra,tr);applyFeedback(T.fb,tr);}catch(e){T.err=sampleError(e);}
  T.loading=false;render();
}
function finishTask(){
  const t=T.t,mins=Math.max(1,Math.round(T.elapsed/60));
  const d=state.profile.done[t.id]||{count:0,totalMins:0,est:t.mins};d.count++;d.totalMins+=mins;d.est=t.mins;d.last=today();state.profile.done[t.id]=d;
  addMinutes(mins);clearInterval(T.timer);T.summary={mins};T.active=false;render();confetti();
}
function renderTask(m){
  const t=T.t;
  if(T.summary){const diff=T.summary.mins-t.mins;
    m.innerHTML=`<div class="view"><div class="glass celebrate" id="cele"><div class="badge">${icon("check")}</div><h1>${esc(t.title)}</h1>
      <p class="muted">Je deed er <b>${T.summary.mins} min</b> over. Geschat was ${t.mins} min${diff?`, dus ${Math.abs(diff)} min ${diff>0?"langer":"korter"}`:", precies op tijd"}.</p>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" data-go="voortgang">Bekijk voortgang</button><button class="btn primary" data-go="opdrachten">Volgende opdracht</button></div></div></div>`;
    m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));return;}
  const p=T.elapsed/(t.mins*60),C=2*Math.PI*52;
  let work="";
  if(t.mode==="rollenspel"){
    const mine=T.chat.filter(x=>x.who==="me").length;
    work=`<div class="chat" id="chat">${T.chat.map(x=>`<div class="msg ${x.who}">${esc(x.text)}</div>`).join("")}${T.loading?'<div class="msg ai"><span class="typing"><i></i><i></i><i></i></span></div>':""}</div>
      ${DICTATE}
      <textarea id="tText" style="min-height:90px" placeholder="Jouw antwoord in het Engels… (Ctrl + Enter om te versturen)">${esc(T.text)}</textarea>
      <div class="spread"><button class="btn ghost" id="tFb" ${mine<2||T.loading||T.fb?"disabled":""}>${icon("spark")} Stop en vraag feedback</button><button class="btn teal" id="tSay" ${T.loading||T.fb?"disabled":""}>Verstuur</button></div>
      ${mine<2&&!T.fb?'<p class="small muted">Na minstens 2 antwoorden kun je feedback vragen.</p>':""}`;
  }else if(t.mode==="shadowing"){
    work=`<p class="version" style="font-size:1.05rem">${esc(t.text)}</p>
      <div class="row"><button class="btn teal" id="tts">${icon("sound")} Voorlezen</button><button class="btn ghost" id="ttsSlow">Langzaam</button><button class="btn ghost" id="ttsStop">Stop</button></div>
      ${DICTATE}
      <textarea id="tText" style="min-height:110px" placeholder="Laatste stap: dicteer de tekst uit je hoofd…">${esc(T.text)}</textarea>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="tSend" ${!sample||T.loading||T.fb?"disabled":""}>${T.loading?'<span class="loading-dots">Claude vergelijkt</span>':icon("spark")+" Vergelijk met origineel"}</button></div>`;
  }else{
    work=`${t.type==="spreken"?DICTATE:""}<textarea id="tText" style="min-height:260px" placeholder="Schrijf in het Engels…">${esc(T.text)}</textarea>
      <div class="spread"><span class="small muted mono" id="wc">${wc(T.text)} woorden</span><button class="btn primary" id="tSend" ${!sample||T.loading||T.fb?"disabled":""}>${T.loading?'<span class="loading-dots">Claude leest mee</span>':icon("spark")+" Vraag feedback"}</button></div>`;
  }
  m.innerHTML=`<div class="view">
    <div class="spread"><button class="btn link" id="tBack">${icon("back")} Later verder</button><span class="chip ${t.mode==="rollenspel"?"amber":""}">${t.mode==="rollenspel"?"Rollenspel":TYPE_LABEL[t.type]}</span></div>
    <section class="glass pad stack">
      <div class="task-head">
        <div class="stack" style="gap:8px"><h1 style="font-size:clamp(1.5rem,3.4vw,2.1rem)">${esc(t.title)}</h1><div class="brief">${esc(t.brief)}</div></div>
        <div class="clock ${p>1?"over":""}"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}"/></svg>
          <div class="lbl"><b>${fmtClock(T.elapsed)}</b><span>${p>1?"over de tijd":"van "+t.mins+" min"}</span></div></div>
      </div>
      <div class="stack" style="gap:8px"><span class="eyebrow">Stappenplan · vink af wat je gedaan hebt</span>
        <ol class="steps">${t.steps.map(([s,mn],i)=>`<li class="${T.checked[i]?"done":""}"><button data-step="${i}"><span class="box">${icon("check")}</span><span class="txt">${esc(s)}</span><span class="chip line">${mn} min</span></button></li>`).join("")}</ol></div>
    </section>
    <section class="glass pad stack">${work}${errHTML(T.err)}${needClaude()}</section>
    ${T.fb?`<section class="glass pad stack"><h2>Feedback</h2>${feedbackHTML(T.fb)}</section>`:""}
    <div class="row" style="justify-content:flex-end"><button class="btn ${T.fb?"primary":"ghost"}" id="tDone">${T.fb?"Afronden en tijd opslaan":"Afronden zonder feedback"}</button></div>
  </div>`;
  const ta=$("#tText");
  if(ta){ta.oninput=()=>{T.text=ta.value;const w=$("#wc");if(w)w.textContent=wc(ta.value)+" woorden";save("resume");};}
  const ch=$("#chat");if(ch)ch.scrollTop=ch.scrollHeight;
  $("#tBack").onclick=()=>{pauseTask();view=null;route="opdrachten";render();};

const READ_TOPICS=["reizen en vakantie","eten en koken","een opvallend nieuwsfeit","sport","technologie in het dagelijks leven","natuur en dieren","een stukje geschiedenis","psychologie en gewoontes","geld en sparen","films en series","muziek","gezondheid en slaap","wonen in de stad","een bekende uitvinding","werk en vrije tijd","vriendschap"];
const WD={test:null,result:null,paste:"",pasteItems:null,pasteSel:{},pasteLoading:false,pasteErr:"",read:null,readLoading:false,readErr:"",readSel:{},readStart:0};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function buildTest(){
  const items=[];
  for(let b=0;b<9;b++){const band=WORDS.slice(b*1000,b*1000+1000);shuffle(band.slice()).slice(0,7).forEach(w=>items.push({w,band:b}));}
  shuffle(PSEUDO.slice()).slice(0,10).forEach(w=>items.push({w,band:-1}));
  return {items:shuffle(items),idx:0,yes:[]};
}
function scoreTest(t){
  const fake=t.items.filter((x,i)=>x.band<0),fa=fake.filter(x=>t.yes[t.items.indexOf(x)]).length/fake.length;
  const bands=[];
  for(let b=0;b<9;b++){
    const its=t.items.map((x,i)=>[x,i]).filter(([x])=>x.band===b),h=its.filter(([,i])=>t.yes[i]).length/its.length;
    bands.push(fa>=1?0:Math.max(0,Math.min(1,(h-fa)/(1-fa))));
  }
  const size=bands.reduce((a,p)=>a+p*1000,0);
  let start=bands.findIndex(p=>p<.8);if(start<0)start=8;
  return {size,bands,fa,start};
}
function finishTest(){
  const r=scoreTest(WD.test),v=vocab();
  WD.test.items.forEach((x,i)=>{if(x.band>=0&&WD.test.yes[i])v.known[x.w]=1;});
  v.next=Math.max(400,r.start*1000);v.test={date:today(),size:Math.round(r.size),bands:r.bands.map(p=>Math.round(p*100)),fa:Math.round(r.fa*100)};
  save("profile");WD.test=null;render();
}
function cefr(n){return n<1500?"A1":n<2500?"A2":n<3250?"B1":n<3750?"B2":n<4500?"C1":"C2";}

function addWordCards(list){
  const n=Date.now(),have=new Set(Object.values(state.cards).map(c=>String(c.en).toLowerCase()));let added=0;
  list.forEach((x,i)=>{if(!x.en||have.has(String(x.en).toLowerCase()))return;state.cards["e"+n+"_"+i]={nl:String(x.nl||""),en:String(x.en),ex:String(x.ex||""),src:"eigen",track:"dagelijks",due:n,created:n};added++;});
  save("deck");return added;
}

}

      <div class="glass kpi"><span class="eyebrow">Geoefend</span><b>${cards.filter(c=>c.reps).length}</b><span class="small muted">van ${cards.length} kaarten</span></div>
      <div class="glass kpi"><span class="eyebrow">Goed vast</span><b>${cards.filter(c=>c.s>=21).length}</b><span class="small muted">3+ weken onthouden</span></div>
      <div class="glass kpi"><span class="eyebrow">Woordenschat</span><b>${vocab().test?"±"+fmtNum(vocab().test.size):"?"}</b><span class="small muted">${vocab().test?"indicatie "+cefr(vocab().test.size):"nog geen test gedaan"}</span></div>
      <div class="glass kpi"><span class="eyebrow">Werk / Dagelijks</span><b>${cards.filter(c=>trackOf(c)==="werk").length} / ${cards.filter(c=>trackOf(c)==="dagelijks").length}</b><span class="small muted">kaarten per spoor</span></div>
    </section>
    <section class="glass pad stack"><div class="spread"><h3>Minuten per dag</h3><span class="small muted">Doel: ${goal} min per dag</span></div>
      <div class="bars">${days.map(([l,v])=>`<div class="${v>=goal?"goal":""}"><span>${v||""}</span><i style="height:${v/max*100}%;${v>=goal?"background:linear-gradient(180deg,var(--amber),var(--amber-soft))":""}"></i><span>${l}</span></div>`).join("")}</div></section>
    <section class="glass pad stack"><div><h3>Welke fouten maak je het vaakst?</h3><p class="small muted">Op basis van alle feedback van Claude. Hier zit je grootste winst.</p></div>
      ${mist.length?mist.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="track"><i style="width:${v/mm*100}%"></i></div><span class="mono small">${v}</span></div>`).join(""):'<p class="muted">Nog geen feedback ontvangen. Na je eerste opdracht zie je hier welke fouten terugkomen.</p>'}</section>
    <section class="glass pad stack"><div><h3>Opdrachten: geschat tegenover echt</h3><p class="small muted">Word je sneller? Vergelijk je gemiddelde tijd met de inschatting.</p></div>
      ${done.length?`<div class="tablewrap"><table><thead><tr><th>Opdracht</th><th>Keer</th><th>Geschat</th><th>Gemiddeld</th></tr></thead><tbody>${done.map(([id,d])=>{const t=LONG_TASKS.find(x=>x.id===id),avg=Math.round(d.totalMins/d.count);return `<tr><td>${esc(t?t.title:"Eigen opdracht")}</td><td class="mono">${d.count}</td><td class="mono">${d.est} min</td><td><span class="chip ${avg<=d.est?"green":"amber"}">${avg} min</span></td></tr>`;}).join("")}</tbody></table></div>`:'<p class="muted">Rond een langere opdracht af om hier je tijden te zien.</p>'}</section>
  </div>`;
}

boot();
</script>
