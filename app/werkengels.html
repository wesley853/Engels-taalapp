<style>
/* Layout: één smalle werkkolom met tabbladen, zoals een briefing-inbox; stappen als genummerde kaarten omdat de volgorde echt een proces is */
:root{

}

  --accent:#4FB8AC; --accent-soft:#18332F; --accent-ink:#0B1413;
  --warn:#F0A060; --warn-soft:#3A2617; --good:#7CC98A; --good-soft:#1B3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#18211F; --ink:#E6ECEA; --muted:#97A5A2; --line:#2B3735;
  --accent:#4FB8AC; --accent-soft:#18332F; --accent-ink:#0B1413;
  --warn:#F0A060; --warn-soft:#3A2617; --good:#7CC98A; --good-soft:#1B3220; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1.08rem;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted);font-size:.95rem}
.streak{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.streak b{color:var(--ink);font-weight:500}

nav.tabs button{font:600 .95rem var(--f-body);background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.step>.n{font-family:var(--f-mono);font-size:.8rem;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted)}
.step.done>.n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.active>.n{border-color:var(--accent);color:var(--accent)}
.step>div{min-width:0;display:flex;flex-direction:column;gap:10px}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.chip.time{background:transparent;border:1px solid var(--line)}

textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}

.task{cursor:pointer;text-align:left;font:inherit;color:inherit}
.task:hover{border-color:var(--accent)}

.mins small{font-size:.75rem;color:var(--muted)}
.timer{font:500 1.6rem var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.over>i{background:var(--warn)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:4px}

.msg.ai{background:var(--bg);align-self:flex-start}
.msg.me{background:var(--accent-soft);align-self:flex-end}

th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- FSRS-5 (standaardparameters) ---------- */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FACTOR=19/81, DAY=864e5;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retr=(t,S)=>Math.pow(1+FACTOR*t/S,DECAY);
const d0=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
function nextState(card,g,now){
  if(!card.s){return {s:W[g-1],d:d0(g)};}
  const t=Math.max(0,(now-card.last)/DAY), R=retr(t,card.s);
  let d=card.d+(-W[6]*(g-3))*(10-card.d)/9;
  d=clamp(W[7]*d0(4)+(1-W[7])*d,1,10);
  let s;
  if(g===1){s=Math.min(card.s,W[11]*Math.pow(card.d,-W[12])*(Math.pow(card.s+1,W[13])-1)*Math.exp(W[14]*(1-R)));}
  else{s=card.s*(Math.exp(W[8])*(11-card.d)*Math.pow(card.s,-W[9])*(Math.exp(W[10]*(1-R))-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1);}
  return {s,d};
}
function intervalDays(card,g,now){
  if(g===1) return 0;
  const st=nextState(card,g,now);
  return Math.max(1,Math.round(st.s)); /* bij 90% gewenste kans op onthouden is interval = S */
}
function review(card,g,now){
  const st=nextState(card,g,now);
  const days=g===1?0:Math.max(1,Math.round(st.s));
  return {...card,s:st.s,d:st.d,last:now,due:g===1?now+10*60e3:now+days*DAY,reps:(card.reps||0)+1,lapses:(card.lapses||0)+(g===1?1:0)};
}
const fmtInt=d=>d===0?"10 min":d<30?d+" d":d<365?Math.round(d/30)+" mnd":(d/365).toFixed(1)+" jr";

/* ---------- Opslag ---------- */
let db=null, uid=null, sample=null, storeMode="lokaal";
const state={cards:{},profile:{days:{},mistakes:{},done:{},dailyIdx:0,lastDaily:""}};
const today=()=>new Date().toISOString().slice(0,10);
function newCardsFromStarter(){
  const now=Date.now(), out={};
  STARTER_CARDS.forEach(([nl,en,ex],i)=>{out["s"+i]={nl,en,ex,src:"start",due:now-(STARTER_CARDS.length-i)*1000,created:now};});
  return out;
}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const writeQ={deck:Promise.resolve(),profile:Promise.resolve()};
let saveTimers={};
function save(which){
  clearTimeout(saveTimers[which]);
  saveTimers[which]=setTimeout(()=>{
    const body=which==="deck"?{cards:state.cards}:state.profile;
    const snapshot=JSON.parse(JSON.stringify(body));
    if(db&&uid){
      writeQ[which]=writeQ[which].then(()=>db.doc("data/users/"+uid+"/"+which).set(snapshot)).catch(e=>showNotice("Opslaan lukte niet ("+(e&&e.code||"fout")+"). Je voortgang staat nog in deze browser."));
    }
    lsSet("we_"+which,snapshot);
  },600);
}
function showNotice(t){const n=document.getElementById("storeNotice");n.textContent=t;n.hidden=!t;}

async function boot(){
  const lc=lsGet("we_deck"), lp=lsGet("we_profile");
  state.cards=(lc&&lc.cards)||newCardsFromStarter();
  if(lp) Object.assign(state.profile,lp);
  renderAll();
  if(!window.claude||!window.claude.use){showNotice("Open deze pagina op claude.ai om feedback van Claude te krijgen en je voortgang op te slaan.");return;}
  claude.use("sample").then(s=>{sample=s;renderAll();});
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(d&&u){
    const id=await u.id();
    if(id){
      db=d;uid=id;storeMode="account";
      try{
        const [deck,prof]=await Promise.all([db.doc("data/users/"+uid+"/deck").get(),db.doc("data/users/"+uid+"/profile").get()]);
        if(deck.exists) state.cards=deck.data().cards||{}; else save("deck");
        if(prof.exists) state.profile=Object.assign({days:{},mistakes:{},done:{},dailyIdx:0,lastDaily:""},prof.data()); else save("profile");
      }catch(e){showNotice("Je opgeslagen voortgang kon niet geladen worden. Je werkt nu met de versie in deze browser.");}
    }
  }
  if(storeMode==="lokaal") showNotice("Je voortgang wordt alleen in deze browser bewaard.");
  renderAll();
}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addMinutes(m){const t=today();state.profile.days[t]=(state.profile.days[t]||0)+m;save("profile");renderStreak();}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(state.profile.days[k]>0){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}
const dueCards=()=>Object.entries(state.cards).filter(([,c])=>c.due<=Date.now()).sort((a,b)=>a[1].due-b[1].due);
function renderStreak(){
  const due=dueCards().length;
  $("#streak").innerHTML=`<span><b>${streak()}</b> dagen op rij</span><span><b>${state.profile.days[today()]||0}</b> min vandaag</span><span><b>${due}</b> kaarten klaar</span>`;
}
function fmtClock(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}

/* ---------- Claude ---------- */
const TUTOR=`You are an English writing and speaking coach for a Dutch online marketing professional (level B1-B2) who wants to sound natural and professional in business English.
Rules:
- Give at most 3 improvement points, the most important first. Prioritise: errors typical for Dutch speakers (false friends, tenses like present perfect, word order, literal translations), then unnatural phrasing, then style.
- Explanations in Dutch, short and concrete. Corrections in English.
- Also give a natural, professional version of the whole text, staying close to the learner's own words.
- Suggest up to 3 useful chunks/collocations from the corrections for spaced repetition. "nl" = Dutch meaning or cue, "en" = English chunk, "ex" = short example sentence.
- "goed" = one specific thing the learner did well (Dutch).
- "categorie" for each point: one of "valse vriend","tijden","woordvolgorde","letterlijk vertaald","woordkeuze","grammatica","stijl","spelling".
Respond ONLY with JSON: {"goed":string,"punten":[{"fout":string,"beter":string,"uitleg":string,"categorie":string}],"versie":string,"kaarten":[{"nl":string,"en":string,"ex":string}]}`;

async function getFeedback(task,text,extra){
  const input=`${TUTOR}

Task given to the learner: ${task}
${extra||""}
Learner's text:
"""
${text}
"""`;
  return sample.json(input,{modelTier:"default"});
}
function applyFeedback(fb){
  const now=Date.now();
  (fb.kaarten||[]).slice(0,3).forEach((k,i)=>{
    if(!k||!k.en) return;
    const dup=Object.values(state.cards).some(c=>c.en.toLowerCase()===String(k.en).toLowerCase());
    if(!dup) state.cards["f"+now+"_"+i]={nl:String(k.nl||""),en:String(k.en),ex:String(k.ex||""),src:"feedback",due:now,created:now};
  });
  (fb.punten||[]).forEach(p=>{const c=p.categorie||"overig";state.profile.mistakes[c]=(state.profile.mistakes[c]||0)+1;});
  save("deck");save("profile");renderStreak();
}
function feedbackHTML(fb){
  const pts=(fb.punten||[]).map(p=>`<div class="fb-point"><div><span class="wrong">${esc(p.fout)}</span> → <span class="right">${esc(p.beter)}</span></div><div class="hint">${esc(p.uitleg)} <span class="chip warn">${esc(p.categorie||"")}</span></div></div>`).join("");
  const ks=(fb.kaarten||[]).slice(0,3).map(k=>`<span class="chip good">${esc(k.en)}</span>`).join("");
  return `<div class="brief"><p><b>Goed:</b> ${esc(fb.goed)}</p></div>
  <div class="label">Verbeterpunten</div><div class="fb-list">${pts||'<p class="hint">Geen verbeterpunten. Sterk!</p>'}</div>
  <div class="label">Natuurlijkere versie</div><div class="answer"><p>${esc(fb.versie)}</p></div>
  ${ks?`<div class="label">Toegevoegd aan je kaarten</div><div class="chips">${ks}</div>`:""}`;
}
function sampleError(e){
  const c=e&&e.code;
  if(c==="not_granted") return "Je hebt geen toestemming gegeven om Claude te gebruiken. Herlaad de pagina en sta het toe om feedback te krijgen.";
  if(c==="rate_limited") return "Je zit even aan je limiet van Claude. Probeer het over een paar minuten opnieuw.";
  return "Feedback ophalen lukte niet. Probeer het opnieuw.";
}
const DICTATE=`<details><summary>Hoe spreek ik in?</summary><p class="hint" style="margin-top:6px">Gebruik de dicteerfunctie van je apparaat. Telefoon: tik op de microfoon van je toetsenbord. Mac: druk twee keer op Fn. Windows: Win + H. Zet de dicteertaal op Engels. Claude beoordeelt wat je zegt (woorden en zinnen), maar kan je uitspraak niet horen.</p></details>`;

/* ---------- Tab: Vandaag ---------- */
const today_s={phase:"review",reviewDone:0,shown:false,input:"",fb:null,loading:false,err:"",text:"",startedAt:0};
const REVIEW_LIMIT=12;
function dailyTask(){
  if(state.profile.lastDaily!==today()){state.profile.dailyIdx=((state.profile.dailyIdx||0)+1)%DAILY_TASKS.length;state.profile.lastDaily=today();save("profile");}
  return DAILY_TASKS[state.profile.dailyIdx%DAILY_TASKS.length];
}
function renderToday(){
  const el=$("#tab-vandaag");
  if(!today_s.startedAt) today_s.startedAt=Date.now();
  const due=dueCards(), task=dailyTask();
  const reviewActive=today_s.phase==="review"&&due.length>0&&today_s.reviewDone<REVIEW_LIMIT;
  if(today_s.phase==="review"&&!reviewActive) today_s.phase="task";
  let s1="";
  if(reviewActive){
    const [id,c]=due[0];
    s1=`<p class="hint">${today_s.reviewDone} van max. ${Math.min(REVIEW_LIMIT,today_s.reviewDone+due.length)} · Typ het Engels en controleer.</p>
    <div class="review-front">${esc(c.nl)}</div>
    ${today_s.shown?`
      ${today_s.input?`<p class="hint">Jij: ${esc(today_s.input)}</p>`:""}
      <div class="answer"><div class="en">${esc(c.en)}</div><div class="hint">${esc(c.ex)}</div></div>
      <div class="grade">${[["Opnieuw",1],["Moeilijk",2],["Goed",3],["Makkelijk",4]].map(([l,g])=>`<button data-grade="${g}" data-id="${id}">${l}<small>${fmtInt(intervalDays(c,g,Date.now()))}</small></button>`).join("")}</div>`
    :`<input type="text" id="revInput" placeholder="In het Engels…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button class="btn" id="revCheck">Controleer</button><button class="btn quiet" id="revSkip">Sla herhalen over</button></div>`}`;
  }else{
    s1=`<p class="hint">${today_s.reviewDone?`${today_s.reviewDone} kaarten herhaald.`:"Geen kaarten die vandaag terug moeten komen."}</p>`;
  }
  const taskPhase=today_s.phase==="task", fbPhase=today_s.phase==="fb";
  let s2=`<div class="spread"><h3>${esc(task.title)}</h3><span class="chip">${task.type}</span></div>
    <div class="brief"><p>${esc(task.brief)}</p><p class="hint">Lengte: ${task.words}</p></div>`;
  if(taskPhase){
    s2+=`${task.type==="spreken"?DICTATE:""}
    <textarea id="dailyText" placeholder="${task.type==="spreken"?"Spreek in met dicteren, of typ wat je zou zeggen…":"Schrijf in het Engels…"}">${esc(today_s.text)}</textarea>
    ${today_s.err?`<p class="notice">${esc(today_s.err)}</p>`:""}
    <div class="row"><button class="btn" id="dailySend" ${sample?"":"disabled"}>${today_s.loading?"Claude leest mee…":"Vraag feedback"}</button>${sample?"":'<span class="hint">Feedback werkt alleen op claude.ai.</span>'}</div>`;
  }
  let s3="";
  if(fbPhase&&today_s.fb){s3=feedbackHTML(today_s.fb)+`<div class="row"><button class="btn ghost" id="dailyAgain">Nog een poging</button></div><p class="hint">Klaar voor vandaag. De nieuwe kaarten komen morgen of overmorgen terug.</p>`;}
  else s3=`<p class="hint">Max. 3 verbeterpunten en een natuurlijkere versie. Nieuwe uitdrukkingen gaan automatisch naar je kaarten.</p>`;
  const st=(n,active,done)=>`step${done?" done":active?" active":""}`;
  el.innerHTML=`
  <div class="spread"><h2>Dagelijkse sessie</h2><span class="chip time">± 8 min</span></div>
  <div class="card ${st(1,reviewActive,!reviewActive)}"><span class="n">1</span><div><div class="spread"><h3>Herhalen</h3><span class="chip time">3 min</span></div>${s1}</div></div>
  <div class="card ${st(2,taskPhase,fbPhase)}"><span class="n">2</span><div><div class="spread"><span class="label">Opdracht van vandaag</span><span class="chip time">4 min</span></div>${s2}</div></div>
  <div class="card ${st(3,fbPhase,false)}"><span class="n">3</span><div><div class="spread"><h3>Feedback</h3><span class="chip time">1 min</span></div>${s3}</div></div>`;
  el.querySelectorAll(".card").forEach(c=>c.classList.add("step"));
  const ri=$("#revInput"); if(ri){ri.focus({preventScroll:true});ri.addEventListener("keydown",e=>{if(e.key==="Enter")checkRev();});}
  $("#revCheck")&&($("#revCheck").onclick=checkRev);
  $("#revSkip")&&($("#revSkip").onclick=()=>{today_s.phase="task";renderToday();});
  el.querySelectorAll("[data-grade]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,g=+b.dataset.grade;
    state.cards[id]=review(state.cards[id],g,Date.now());
    today_s.reviewDone++;today_s.shown=false;today_s.input="";
    save("deck");renderToday();renderStreak();
  });
  const ta=$("#dailyText"); if(ta) ta.oninput=()=>{today_s.text=ta.value;};
  $("#dailySend")&&($("#dailySend").onclick=async()=>{
    const text=(today_s.text||"").trim(); if(text.length<15){today_s.err="Schrijf of spreek eerst wat meer in.";renderToday();return;}
    today_s.loading=true;today_s.err="";renderToday();
    try{const fb=await getFeedback(task.brief+" ("+task.words+")",text);today_s.fb=fb;today_s.phase="fb";applyFeedback(fb);
      addMinutes(Math.max(1,Math.round((Date.now()-today_s.startedAt)/60000)));today_s.startedAt=Date.now();}
    catch(e){today_s.err=sampleError(e);}
    today_s.loading=false;renderToday();
  });
  $("#dailyAgain")&&($("#dailyAgain").onclick=()=>{today_s.phase="task";today_s.fb=null;renderToday();});
}
function checkRev(){today_s.input=($("#revInput")||{}).value||"";today_s.shown=true;renderToday();}

/* ---------- Tab: Opdrachten ---------- */
const lt={active:null,start:0,elapsed:0,timer:null,text:"",fb:null,loading:false,err:"",chat:[],custom:{desc:"",mins:20,type:"schrijven"}};
function doneInfo(id){const d=state.profile.done[id];return d?`<span class="chip good">${d.count}× gedaan · gem. ${Math.round(d.totalMins/d.count)} min</span>`:"";}
function renderLong(){
  const el=$("#tab-opdrachten");
  if(lt.active){renderActive(el);return;}
  const groups=[["Kort (10 tot 15 min)",t=>t.mins<=15],["Middel (20 tot 30 min)",t=>t.mins>15&&t.mins<=30],["Lang (45 min of meer)",t=>t.mins>30]];
  el.innerHTML=`<div><h2>Langere opdrachten</h2><p class="sub">Voor als je meer tijd hebt. De tijd is een inschatting; je ziet na afloop hoe lang je er echt over deed.</p></div>
  ${groups.map(([lbl,f])=>{const ts=LONG_TASKS.filter(f);return ts.length?`<div class="label">${lbl}</div><div class="tasks">${ts.map(t=>`
    <button class="card task" data-task="${t.id}">
      <div class="meta"><span class="mins">${t.mins}<small> min</small></span><span class="chips"><span class="chip">${t.type}</span>${t.mode==="rollenspel"?'<span class="chip">rollenspel</span>':""}</span></div>
      <h3>${esc(t.title)}</h3><p class="hint">${esc(t.brief)}</p>${doneInfo(t.id)}
    </button>`).join("")}</div>`:""}).join("")}
  <div class="card"><h3>Eigen opdracht</h3><p class="hint">Plak een echte mail of beschrijf een situatie uit je werk. Kies hoeveel tijd je hebt.</p>
    <textarea id="cDesc" placeholder="Bijv.: Ik moet morgen een klant uitleggen waarom we overstappen naar Performance Max…">${esc(lt.custom.desc)}</textarea>
    <div class="row"><select id="cType" style="width:auto"><option value="schrijven">Schrijven</option><option value="spreken">Spreken</option><option value="rollenspel">Rollenspel</option></select>
    <select id="cMins" style="width:auto"><option>10</option><option selected>20</option><option>30</option><option>45</option></select><span class="hint">min</span>
    <button class="btn" id="cStart">Start</button></div></div>`;
  $("#cType").value=lt.custom.type;$("#cMins").value=String(lt.custom.mins);
  el.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>startLong(LONG_TASKS.find(t=>t.id===b.dataset.task)));
  $("#cDesc").oninput=e=>lt.custom.desc=e.target.value;
  $("#cType").onchange=e=>lt.custom.type=e.target.value;
  $("#cMins").onchange=e=>lt.custom.mins=+e.target.value;
  $("#cStart").onclick=()=>{
    const d=lt.custom.desc.trim(); if(d.length<10) return;
    const rp=lt.custom.type==="rollenspel";
    startLong({id:"eigen",mins:lt.custom.mins,type:rp?"spreken":lt.custom.type,mode:rp?"rollenspel":"feedback",title:"Eigen opdracht",brief:d,
      role:rp?`Play the other person in this workplace situation described by the learner (in Dutch): "${d}". Stay in character, be realistic, ask follow-up questions.`:"",
      steps:["Bedenk wat je wilt zeggen","Voer de opdracht uit","Neem de feedback door"]});
  };
}
function startLong(t){
  Object.assign(lt,{active:t,start:Date.now(),elapsed:0,text:"",fb:null,err:"",chat:[],loading:false});
  clearInterval(lt.timer);lt.timer=setInterval(tick,1000);
  renderLong();
  if(t.mode==="rollenspel") aiTurn();
}
function tick(){
  if(!lt.active) return;
  lt.elapsed=Math.floor((Date.now()-lt.start)/1000);
  const tEl=$("#ltClock"),bEl=$("#ltBar");
  if(tEl){tEl.textContent=fmtClock(lt.elapsed);const p=lt.elapsed/(lt.active.mins*60);bEl.firstElementChild.style.width=Math.min(100,p*100)+"%";bEl.classList.toggle("over",p>1);}
}
function finishLong(){
  const t=lt.active, mins=Math.max(1,Math.round(lt.elapsed/60));
  const d=state.profile.done[t.id]||{count:0,totalMins:0,est:t.mins};
  d.count++;d.totalMins+=mins;d.last=today();state.profile.done[t.id]=d;
  addMinutes(mins);
  clearInterval(lt.timer);
  lt.summary={title:t.title,mins,est:t.mins};
  lt.active=null;renderLong();
  const el=$("#tab-opdrachten");
  const diff=mins-lt.summary.est;
  el.insertAdjacentHTML("afterbegin",`<div class="card"><h3>Afgerond: ${esc(lt.summary.title)}</h3><p>Je deed er <b>${mins} min</b> over (geschat: ${lt.summary.est} min${diff?`, ${Math.abs(diff)} min ${diff>0?"langer":"korter"}`:""}).</p></div>`);
}
async function aiTurn(){
  const t=lt.active; if(!sample){lt.err="Rollenspel werkt alleen op claude.ai.";renderLong();return;}
  lt.loading=true;renderLong();
  const sys=`${t.role}
This is a speaking practice role-play with a Dutch learner (B1-B2) of business English. Speak natural, professional British or American business English. Keep each reply to 1-3 sentences and end with something the learner can respond to. Do not correct the learner during the conversation. Never break character.`;
  const turns=[{role:"user",content:sys+"\n\nStart the conversation now with your first line."}];
  lt.chat.forEach(m=>turns.push({role:m.who==="ai"?"assistant":"user",content:m.text}));
  try{
    const r=await sample(turns,{modelTier:"quick",cache:false});
    lt.chat.push({who:"ai",text:r.text.trim()});
  }catch(e){lt.err=sampleError(e);}
  lt.loading=false;renderLong();
}

  <div class="card">
    <div class="spread"><h2>${esc(t.title)}</h2><span class="chips"><span class="chip">${t.type}</span></span></div>

  ${lt.fb?`<div class="card">${feedbackHTML(lt.fb)}<div class="row"><button class="btn" id="ltDone">Afronden en tijd opslaan</button></div></div>`:
   `<div class="row"><button class="btn quiet" id="ltDone">Afronden zonder feedback</button></div>`}`;
  const ta=$("#ltText"); if(ta){ta.oninput=()=>{lt.text=ta.value;const w=$("#wc");if(w)w.textContent=(ta.value.trim().split(/\s+/).filter(Boolean).length)+" woorden";};}

    const v=lt.text.trim(); if(v.length<15){lt.err="Schrijf eerst wat meer.";renderLong();return;}
    sendLong(v,t.mode==="shadowing"?`The learner tried to reproduce this text from memory (via dictation). Original text:\n"${t.text}"\nFocus on what they missed or changed and which chunks to remember.`:"");
  });
  const speak=rate=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.text);u.lang="en-GB";u.rate=rate;speechSynthesis.speak(u);}catch(e){lt.err="Voorlezen werkt niet in deze browser.";renderLong();}};
  $("#tts")&&($("#tts").onclick=()=>speak(1));
  $("#ttsSlow")&&($("#ttsSlow").onclick=()=>speak(.75));
  $("#ttsStop")&&($("#ttsStop").onclick=()=>{try{speechSynthesis.cancel();}catch(e){}});
}
async function sendLong(text,extra){
  lt.loading=true;lt.err="";renderLong();
  try{const fb=await getFeedback(lt.active.brief,text,extra);lt.fb=fb;applyFeedback(fb);}catch(e){lt.err=sampleError(e);}
  lt.loading=false;renderLong();
}

/* ---------- Tab: Kaarten ---------- */
const kf={q:"",adding:false};
function renderCards(){
  const el=$("#tab-kaarten");
  const all=Object.entries(state.cards).sort((a,b)=>a[1].due-b[1].due);
  const q=kf.q.toLowerCase();
  const list=all.filter(([,c])=>!q||c.nl.toLowerCase().includes(q)||c.en.toLowerCase().includes(q));
  const when=c=>{const d=(c.due-Date.now())/DAY;return d<=0?'<span class="chip warn">nu</span>':d<1?'<span class="chip time">vandaag</span>':`<span class="chip time">${fmtInt(Math.round(d))}</span>`;};
  el.innerHTML=`<div class="spread"><div><h2>Kaarten</h2><p class="sub">${all.length} kaarten. Herhaling volgens het FSRS-algoritme: elke kaart komt terug net voordat je hem zou vergeten.</p></div></div>
  <div class="card"><h3>Kaart toevoegen</h3>
    <div class="row" style="flex-wrap:nowrap;flex-direction:column;align-items:stretch">
      <input type="text" id="nNl" placeholder="Nederlands of hint (bijv. 'iets uitstellen')">
      <input type="text" id="nEn" placeholder="Engels (bijv. 'put something on hold')">
      <input type="text" id="nEx" placeholder="Voorbeeldzin (optioneel)">
    </div><div class="row"><button class="btn" id="nAdd">Toevoegen</button></div></div>
  <input type="text" id="kSearch" placeholder="Zoek in je kaarten…" value="${esc(kf.q)}">
  <div class="card tablewrap"><table><thead><tr><th>Nederlands</th><th>Engels</th><th>Terug</th><th></th></tr></thead><tbody>
  ${list.map(([id,c])=>`<tr><td>${esc(c.nl)}</td><td><b>${esc(c.en)}</b><div class="hint">${esc(c.ex)}</div></td><td>${when(c)}</td><td><button class="btn quiet" data-del="${id}" aria-label="Verwijder">×</button></td></tr>`).join("")}
  </tbody></table></div>`;
  $("#kSearch").oninput=e=>{kf.q=e.target.value;const pos=e.target.selectionStart;renderCards();const s=$("#kSearch");s.focus();s.setSelectionRange(pos,pos);};
  $("#nAdd").onclick=()=>{const nl=$("#nNl").value.trim(),en=$("#nEn").value.trim();if(!nl||!en)return;
    const now=Date.now();state.cards["u"+now]={nl,en,ex:$("#nEx").value.trim(),src:"eigen",due:now,created:now};save("deck");renderCards();renderStreak();};
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.confirm){delete state.cards[b.dataset.del];save("deck");renderCards();renderStreak();}
    else{b.dataset.confirm="1";b.textContent="Zeker?";}
  });
}

/* ---------- Tab: Voortgang ---------- */
function renderProgress(){
  const el=$("#tab-voortgang");
  const cards=Object.values(state.cards);
  const learned=cards.filter(c=>c.s&&c.s>=21).length, started=cards.filter(c=>c.reps).length;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);days.push([d.toLocaleDateString("nl-NL",{weekday:"short"}),state.profile.days[k]||0]);}
  const max=Math.max(10,...days.map(d=>d[1]));
  const weekTotal=days.reduce((a,d)=>a+d[1],0);
  const mist=Object.entries(state.profile.mistakes).sort((a,b)=>b[1]-a[1]);
  const mmax=Math.max(1,...mist.map(m=>m[1]));
  const done=Object.entries(state.profile.done);
  el.innerHTML=`<h2>Voortgang</h2>
  <div class="stats">
    <div class="stat"><span class="label">Dagen op rij</span><b>${streak()}</b></div>
    <div class="stat"><span class="label">Deze week</span><b>${weekTotal} min</b></div>
    <div class="stat"><span class="label">Kaarten geoefend</span><b>${started}</b></div>
    <div class="stat"><span class="label">Goed vast</span><b>${learned}</b><span class="hint">3+ weken onthouden</span></div>
  </div>
  <div class="card"><h3>Minuten per dag</h3><div class="week">${days.map(([l,v])=>`<div><span>${v||""}</span><i style="height:${v/max*80}%"></i><span>${l}</span></div>`).join("")}</div></div>
  <div class="card"><h3>Je meest gemaakte fouten</h3>
   ${mist.length?mist.map(([k,v])=>`<div style="display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center"><span>${esc(k)}</span><div class="bar"><i style="width:${v/mmax*100}%;background:var(--warn)"></i></div><span style="font-family:var(--f-mono);font-size:.85rem">${v}</span></div>`).join(""):'<p class="hint">Nog geen feedback ontvangen. Na je eerste opdracht zie je hier welke soort fouten terugkomen.</p>'}</div>
  <div class="card"><h3>Opdrachten: geschat vs. echt</h3>
   ${done.length?`<div class="tablewrap"><table><thead><tr><th>Opdracht</th><th>Keer</th><th>Geschat</th><th>Gemiddeld echt</th></tr></thead><tbody>${done.map(([id,d])=>{const t=LONG_TASKS.find(x=>x.id===id);return `<tr><td>${esc(t?t.title:"Eigen opdracht")}</td><td>${d.count}</td><td>${d.est} min</td><td>${Math.round(d.totalMins/d.count)} min</td></tr>`;}).join("")}</tbody></table></div>`:'<p class="hint">Rond een langere opdracht af om te zien hoe lang je er echt over doet.</p>'}</div>`;
}

/* ---------- Tabs ---------- */
function renderAll(){renderStreak();renderToday();if(!lt.active)renderLong();renderCards();renderProgress();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
  document.querySelectorAll(".panel").forEach(p=>p.hidden=p.id!=="tab-"+b.dataset.tab);
  if(b.dataset.tab==="voortgang")renderProgress();
  if(b.dataset.tab==="kaarten")renderCards();
  if(b.dataset.tab==="vandaag")renderToday();
  try{localStorage.setItem("we_tab",b.dataset.tab);}catch(e){}
});
boot();
(()=>{let t=null;try{t=localStorage.getItem("we_tab");}catch(e){}const b=t&&document.querySelector(`[data-tab="${t}"]`);if(b)b.click();})();
</script>
